<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'DM Sans',sans-serif;
  background:linear-gradient(145deg,#0a1f44 0%,#0e2d6a 55%,#1a3a8f 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:24px;text-align:center;overflow:hidden;position:relative;
}
.bg-pattern{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 20% 80%,rgba(200,168,75,.10) 0%,transparent 50%),
             radial-gradient(circle at 80% 20%,rgba(37,99,235,.15) 0%,transparent 50%);
}
.card{
  position:relative;z-index:1;
  background:rgba(255,255,255,.07);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.14);
  border-radius:24px;
  padding:52px 48px;
  max-width:520px;
  width:100%;
}
.error-num{
  font-family:'Playfair Display',serif;
  font-size:clamp(5rem,15vw,8rem);
  font-weight:800;
  color:#f0d97a;
  line-height:1;
  margin-bottom:8px;
}
.error-icon{
  font-size:2rem;color:rgba(255,255,255,.4);margin-bottom:20px;
}
h1{
  font-family:'Playfair Display',serif;
  color:#fff;font-size:clamp(1.4rem,4vw,2rem);
  font-weight:700;margin-bottom:12px;
}
p{
  color:rgba(255,255,255,.65);
  font-size:1rem;line-height:1.7;margin-bottom:32px;
}
.btn-group{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:12px 28px;border-radius:50px;
  font-family:'DM Sans',sans-serif;font-size:.95rem;font-weight:600;
  text-decoration:none;transition:all .3s ease;border:none;cursor:pointer;
}
.btn-primary{
  background:linear-gradient(135deg,#2563eb,#1a3a8f);
  color:#fff;box-shadow:0 4px 20px rgba(37,99,235,.38);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(37,99,235,.5);}
.btn-outline{
  background:transparent;border:2px solid rgba(255,255,255,.3);color:#fff;
}
.btn-outline:hover{background:rgba(255,255,255,.1);}
.divider{
  width:48px;height:3px;
  background:linear-gradient(90deg,#c8a84b,#2563eb);
  border-radius:2px;margin:0 auto 24px;
}
.helpful-links{margin-top:36px;padding-top:28px;border-top:1px solid rgba(255,255,255,.10);}
.helpful-links p{font-size:.82rem;color:rgba(255,255,255,.4);margin-bottom:14px;}
.links-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
.links-row a{
  color:rgba(255,255,255,.6);font-size:.82rem;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);
  padding:5px 14px;border-radius:50px;text-decoration:none;transition:.2s;
}
.links-row a:hover{color:#f0d97a;background:rgba(255,255,255,.10);}
</style>
</head>
<body>
<div class="bg-pattern"></div>
<div class="card">
  <div class="error-num">404</div>
  <div class="divider"></div>
  <div class="error-icon"><i class="fas fa-search"></i></div>
  <h1>Page Not Found</h1>
  <p>The page you're looking for doesn't exist or may have been moved. Let's get you back on track.</p>
  <div class="btn-group">
    <a href="/" class="btn btn-primary"><i class="fas fa-home"></i> Go to Homepage</a>
    <a href="/#contact" class="btn btn-outline"><i class="fas fa-phone-alt"></i> Contact Us</a>
  </div>
  <div class="helpful-links">
    <p>Or jump to a section:</p>
    <div class="links-row">
      <a href="/#services">Our Services</a>
      <a href="/#gst-registration">GST Registration</a>
      <a href="/#gst-returns">GST Returns</a>
      <a href="/#faq">FAQ</a>
    </div>
  </div>
</div>
<!-- GST Chatbot Widget -->
<script src="/assets/chatbot.js"></script>
</body>
</html>
